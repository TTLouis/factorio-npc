name: CI

on:
  push:
    branches:
      - main
      - feat/npc-transition-work
      - experiment/jev-agent-architecture

  pull_request:
    branches:
      - main
      - feat/npc-transition-work
      - experiment/jev-agent-architecture

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run build && pnpm run typecheck

      - name: Parse generated Lua with LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          luajit -b packages/autorio/dist/control.lua /tmp/autorio-control.luac

      - name: Reject untyped JavaScript semantics in generated Lua
        run: pnpm --filter autorio.ts run check:lua

      - name: Compile native NPC Pterodactyl guard
        run: |
          node deploy/pterodactyl/staging/source-preparer.mjs . deploy/pterodactyl/staging/guard.ts
          pnpm --filter autorio.ts run typecheck
          pnpm --filter autorio.ts run build

      - name: Test
        run: pnpm run test

  pterodactyl-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate local Compose RCON secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          rm -f .env
          trap 'rm -f .env' EXIT

          if env -u FACTORIO_RCON_PASSWORD docker compose -f compose.devcontainer.yml config >/tmp/devcontainer-missing-password.log 2>&1; then
            echo 'compose.devcontainer.yml accepted a missing FACTORIO_RCON_PASSWORD'
            exit 1
          fi
          grep -F 'set FACTORIO_RCON_PASSWORD in repo-root .env' /tmp/devcontainer-missing-password.log

          cat > .env <<'EOF'
          FACTORIO_RCON_PASSWORD=ci-rcon-sentinel
          OPENAI_API_KEY=ci-openai-must-not-leak
          OPENAI_API_BASEURL=https://example.invalid/v1
          OPENAI_MODEL=ci-model
          FACTORIO_USERNAME=ci-factorio-user-must-not-leak
          FACTORIO_TOKEN=ci-factorio-token-must-not-leak
          JEV_TYPESAFE_API_KEY=ci-jev-sentinel
          DESKTOP_OPERATOR_TOKEN=ci-desktop-operator-sentinel
          EOF

          docker compose -f compose.devcontainer.yml config --format json > /tmp/devcontainer-compose.json
          docker compose -f compose.yml -f compose.e2e.yml -f compose.desktop-operator.yml --profile desktop-operator config --format json > /tmp/e2e-compose.json

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const dev = JSON.parse(fs.readFileSync('/tmp/devcontainer-compose.json', 'utf8'))
          const rconApi = dev.services['rcon-api']
          assert.deepEqual(Object.keys(rconApi.environment).sort(), [
            'FACTORIO_RCON_HOST',
            'FACTORIO_RCON_PASSWORD',
            'FACTORIO_RCON_PORT',
          ])
          assert.equal(rconApi.environment.FACTORIO_RCON_PASSWORD, 'ci-rcon-sentinel')
          assert.equal(rconApi.environment.FACTORIO_RCON_HOST, 'localhost')
          assert.equal(rconApi.network_mode, 'host')
          assert.equal(rconApi.ports, undefined)
          for (const key of ['OPENAI_API_KEY', 'OPENAI_API_BASEURL', 'OPENAI_MODEL', 'FACTORIO_USERNAME', 'FACTORIO_TOKEN', 'TYPESAFE_API_KEY']) {
            assert.equal(Object.hasOwn(rconApi.environment, key), false)
          }

          const apiConfigMount = rconApi.volumes.find(volume => volume.target === '/app/api-server/config/config.yaml')
          assert.ok(apiConfigMount, 'missing factorio-rcon-api loopback config mount')
          assert.equal(apiConfigMount.read_only, true)
          const apiConfig = fs.readFileSync('.devcontainer/factorio-rcon-api.yml', 'utf8')
          assert.match(apiConfig, /^\s*http_server_addr:\s*["']127\.0\.0\.1:24180["']\s*$/m)
          assert.match(apiConfig, /^\s*grpc_server_addr:\s*["']127\.0\.0\.1:24181["']\s*$/m)
          assert.doesNotMatch(apiConfig, /0\.0\.0\.0/)

          const local = JSON.parse(fs.readFileSync('/tmp/e2e-compose.json', 'utf8'))
          assert.equal(local.services['sgluna-factorio'].environment.SGLUNA_RCON_PASSWORD, 'ci-rcon-sentinel')
          assert.equal(local.services['desktop-operator'].environment.SGLUNA_RCON_PASSWORD, 'ci-rcon-sentinel')

          const rconPort = local.services['sgluna-factorio'].ports.find(port => Number(port.target) === 27015)
          assert.ok(rconPort, 'missing local E2E RCON port')
          assert.equal(rconPort.host_ip, '127.0.0.1')

          const operatorPort = local.services['desktop-operator'].ports.find(port => Number(port.target) === 24181)
          assert.ok(operatorPort, 'missing desktop operator port')
          assert.equal(operatorPort.host_ip, '127.0.0.1')
          NODE

      - name: Check generated egg artifacts
        run: |
          sha256sum deploy/pterodactyl/payload-src/installer.sh
          node deploy/pterodactyl/build-payload.mjs --check

      - name: Test payload verifier portability
        run: node --test deploy/pterodactyl/build-payload.test.mjs

      # No --test-force-exit: it exits a file's child process before its report
      # is flushed, which silently dropped the tail of planning-state.test.mjs
      # (842 of 849 tests reported, still green). The step timeout covers a
      # leaked handle instead.
      - name: Test standalone-NPC deployment protocol and production runtime
        timeout-minutes: 10
        run: node --test deploy/pterodactyl/staging/*.test.mjs deploy/pterodactyl/runtime-v8/*.test.mjs

  factorio-npc-deterministic:
    if: github.ref == 'refs/heads/feat/npc-transition-work' || github.ref == 'refs/heads/experiment/jev-agent-architecture' || github.base_ref == 'feat/npc-transition-work' || github.base_ref == 'experiment/jev-agent-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Run deterministic Factorio NPC harness
        run: pnpm test:npc
