name: Pterodactyl release gates

on:
  push:
    branches:
      - main
      - feat/npc-transition-work
      - experiment/jev-agent-architecture

  workflow_dispatch:

concurrency:
  group: pterodactyl-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pterodactyl-package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify generated standalone-NPC egg
        run: |
          node deploy/pterodactyl/build-payload.mjs --check
          bash -n deploy/pterodactyl/package-smoke.sh

      - name: Install and boot packaged zero-player NPC
        env:
          SGLUNA_SMOKE_SOURCE_REF: ${{ github.sha }}
        run: bash deploy/pterodactyl/package-smoke.sh

  npc-factorio-integration:
    # ci.yml's factorio-npc-deterministic job already runs this same real
    # zero-player Factorio harness on feat/npc-transition-work and
    # experiment/jev-agent-architecture pushes; only run it here for main and
    # manual dispatch to avoid paying for it twice per commit.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run prompt contract and zero-player Factorio harness
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            if docker build -f tests/factorio/Dockerfile -t airi-factorio-npc-test .; then
              break
            fi
            [[ "$attempt" -lt 3 ]] || exit 1
            sleep $((attempt * 10))
          done
          docker run --rm airi-factorio-npc-test
