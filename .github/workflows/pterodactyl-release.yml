name: Pterodactyl release gates

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pterodactyl-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pterodactyl-package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify generated standalone-NPC egg
        run: |
          node deploy/pterodactyl/build-payload.mjs --check
          bash -n deploy/pterodactyl/package-smoke.sh

      - name: Install and boot packaged zero-player NPC
        run: bash deploy/pterodactyl/package-smoke.sh

  npc-factorio-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run prompt contract and zero-player Factorio harness
        run: docker build -f tests/factorio/Dockerfile -t airi-factorio-npc-test . && docker run --rm airi-factorio-npc-test
