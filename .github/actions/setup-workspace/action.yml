name: Set up workspace
description: Install the pinned pnpm workspace on Node 24
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
