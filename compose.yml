services:
  sgluna-factorio:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      no_cache: true
      args:
        SGLUNA_SOURCE_REF: ${SGLUNA_SOURCE_REF:-main}
        FACTORIO_VERSION: ${FACTORIO_VERSION:-latest}
    image: factorio-npc:local
    platform: linux/amd64
    restart: unless-stopped
    stdin_open: true
    tty: true
    stop_grace_period: ${SGLUNA_STOP_GRACE_PERIOD:-90s}
    ports:
      - "${SERVER_PORT:-34197}:${SERVER_PORT:-34197}/udp"
    volumes:
      - "${SGLUNA_DATA_DIR:-./data}:/data"
    environment:
      CONTAINER_ROOT: /data
      SGLUNA_ACTOR_MODE: ${SGLUNA_ACTOR_MODE:-npc}
      SGLUNA_CHAT_PLAYERS: ${SGLUNA_CHAT_PLAYERS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_API_BASEURL: ${OPENAI_API_BASEURL:?Set OPENAI_API_BASEURL in .env}
      OPENAI_MODEL: ${OPENAI_MODEL:?Set OPENAI_MODEL in .env}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-300000}
      SAVE_NAME: ${SAVE_NAME:-}
      FACTORIO_USERNAME: ${FACTORIO_USERNAME:-}
      FACTORIO_TOKEN: ${FACTORIO_TOKEN:-}
      MAX_PROVIDER_REQUESTS_PER_HOUR: ${MAX_PROVIDER_REQUESTS_PER_HOUR:-300}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-60000}
      SERVER_PORT: ${SERVER_PORT:-34197}
